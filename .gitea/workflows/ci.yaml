name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: latest
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  python-service:
    name: Python Face Service
    runs-on: latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (Flutter)
    runs-on: latest
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

  docker-build:
    name: Docker Build Check
    runs-on: latest
    needs: [backend, python-service, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -t be:ci ./be

      - name: Build Python service image
        run: docker build -t python-face:ci ./python
