name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  python-service:
    name: Python Face Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-extras

      - name: Generate protobuf
        run: uv run python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. proto/face/v1/face.proto

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, python-service]
    if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -t be:ci ./be

      - name: Build Python service image
        run: docker build -t python-face:ci ./python

  deploy:
    name: Deploy BE & Python to VPS
    runs-on: ubuntu-latest
    needs: [backend, python-service]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write env files from secrets
        env:
          BE_ENV: ${{ secrets.BE_ENV }}
          PYTHON_ENV: ${{ secrets.PYTHON_ENV }}
        run: |
          printf "%s\n" "$BE_ENV" > be/.env
          printf "%s\n" "$PYTHON_ENV" > python/.env

      - name: Build Docker images
        run: |
          docker compose build be python-face

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml,be,python,be/.env,python/.env"
          target: ${{ secrets.VPS_TARGET_DIR }}
          strip_components: 0

      - name: Deploy services on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BE_ENV: ${{ secrets.BE_ENV }}
          PYTHON_ENV: ${{ secrets.PYTHON_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BE_ENV,PYTHON_ENV
          script: |
            set -e
            cd ${{ secrets.VPS_TARGET_DIR }}
            printf "%s\n" "$BE_ENV" > be/.env
            printf "%s\n" "$PYTHON_ENV" > python/.env
            docker compose up -d --build be python-face
            docker image prune -f
